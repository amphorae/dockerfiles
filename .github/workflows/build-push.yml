name: Build and push Docker image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'pzserver/Dockerfile'
      - '.github/workflows/build-push.yml'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./pzserver
          file: ./pzserver/Dockerfile
          push: true
          tags: |
            ghcr.io/amphorae/pzserver:stable
            ghcr.io/amphorae/pzserver:${{ github.sha }}
